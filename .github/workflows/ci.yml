name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs when a PR gets new commits. Scoped to pull_request only
# so a main-branch run (which publishes the tip release) is never killed midway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap gate: does this change actually touch the app? Website, evals, docs,
  # .claude, workflow, and markdown-only changes skip the expensive build below.
  # build-test is a required check, so it must still REPORT on every PR — a job
  # skipped via `if:` reports "skipped", which branch protection treats as a pass
  # (unlike a workflow-level paths filter, which would leave it stuck pending).
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect app changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # `every` + all-negated globs = "match any changed file that is NOT one
          # of these paths". Deny-list on purpose: an unlisted path runs CI (cheap
          # mistake) rather than skipping a real app change (dangerous one).
          predicate-quantifier: 'every'
          filters: |
            app:
              - '!website/**'
              - '!evals/**'
              - '!docs/**'
              - '!.claude/**'
              - '!.github/**'
              - '!**/*.md'

  build-test:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Preflight
        run: ./scripts/e2e_preflight.sh

      - name: Download model for smoke checks
        run: ./scripts/setup_model.sh

      - name: Build Local LLM helper
        run: ./scripts/setup_llama_cpp.sh

      - name: Build Debug
        run: ./scripts/build_app.sh Debug --derived-data-path .derivedData --output-dir dist

      - name: Build Release
        run: ./scripts/build_app.sh Release --derived-data-path .derivedData --output-dir dist

      - name: Smoke checks
        run: ./scripts/e2e_smoke.sh

      - name: Unit tests
        timeout-minutes: 25
        run: |
          xcodegen generate --spec project.yml
          xcodebuild \
            -project Suniye.xcodeproj \
            -scheme Suniye \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -enableCodeCoverage YES \
            -resultBundlePath .derivedData/coverage.xcresult \
            test \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES

      - name: Coverage report and gate
        run: ./scripts/coverage_report.sh --threshold 90

      - name: Upload logs/artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-artifacts
          path: |
            .derivedData
            .e2e
            dist

  publish-tip:
    needs: [changes, build-test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Preflight
        run: ./scripts/e2e_preflight.sh

      - name: Import code signing identity
        env:
          SUNIYE_CODESIGN_CERTIFICATE_P12_BASE64: ${{ secrets.SUNIYE_CODESIGN_CERTIFICATE_P12_BASE64 }}
          SUNIYE_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.SUNIYE_CODESIGN_CERTIFICATE_PASSWORD }}
          SUNIYE_CODESIGN_IDENTITY: ${{ secrets.SUNIYE_CODESIGN_IDENTITY }}
        run: ./scripts/import_codesign_identity.sh

      - name: Package tip artifacts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          TIP_VERSION="$(git describe --tags --match 'v[0-9]*' --abbrev=0)"
          TIP_URL_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/tip/"
          NOTES_FILE="$(mktemp)"
          printf 'Tip builds are generated from the latest main branch commit.\n\nCommit: %s\n' "${GITHUB_SHA}" > "${NOTES_FILE}"
          ./scripts/package_release.sh \
            --version "${TIP_VERSION}" \
            --build-channel tip \
            --appcast-channel tip \
            --download-url-prefix "${TIP_URL_PREFIX}" \
            --dist-dir dist-tip \
            --release-notes-file "${NOTES_FILE}"

      - name: Verify tip artifacts
        run: |
          TIP_VERSION="$(git describe --tags --match 'v[0-9]*' --abbrev=0)"
          TIP_URL_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/tip/"
          ./scripts/verify_release.sh \
            --version "${TIP_VERSION}" \
            --download-url-prefix "${TIP_URL_PREFIX}" \
            --channel tip \
            --build-channel tip \
            --dist-dir dist-tip

      - name: Publish tip release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f tip "${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/tip

          NOTES_FILE="$(mktemp)"
          printf 'Tip builds are generated from the latest main branch commit.\n\nCommit: %s\n' "${GITHUB_SHA}" > "${NOTES_FILE}"

          if gh release view tip --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit tip --repo "${GITHUB_REPOSITORY}" --title "Suniye Tip" --prerelease --notes-file "${NOTES_FILE}"
          else
            gh release create tip --repo "${GITHUB_REPOSITORY}" --title "Suniye Tip" --prerelease --latest=false --notes-file "${NOTES_FILE}"
          fi

          gh release upload tip --repo "${GITHUB_REPOSITORY}" \
            dist-tip/Suniye.dmg \
            dist-tip/Suniye.app.zip \
            dist-tip/SHA256SUMS.txt \
            dist-tip/appcast.xml \
            --clobber

      - name: Cleanup code signing identity
        if: always()
        run: ./scripts/import_codesign_identity.sh cleanup
