name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Preflight
        run: ./scripts/e2e_preflight.sh

      - name: Setup model
        run: ./scripts/setup_model.sh

      - name: Smoke checks
        run: ./scripts/e2e_smoke.sh

      - name: Unit tests
        run: |
          xcodegen generate --spec project.yml
          xcodebuild \
            -project Suniye.xcodeproj \
            -scheme Suniye \
            -destination 'platform=macOS' \
            -derivedDataPath .derivedData \
            test

      - name: Import code signing identity
        env:
          SUNIYE_CODESIGN_CERTIFICATE_P12_BASE64: ${{ secrets.SUNIYE_CODESIGN_CERTIFICATE_P12_BASE64 }}
          SUNIYE_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.SUNIYE_CODESIGN_CERTIFICATE_PASSWORD }}
          SUNIYE_CODESIGN_IDENTITY: ${{ secrets.SUNIYE_CODESIGN_IDENTITY }}
        run: ./scripts/import_codesign_identity.sh

      - name: Package release artifacts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/package_release.sh --version "${GITHUB_REF_NAME}" --build-channel stable --dist-dir dist

      - name: Verify release artifacts
        run: ./scripts/verify_release.sh --version "${GITHUB_REF_NAME}" --build-channel stable --dist-dir dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/Suniye.dmg
            dist/Suniye.app.zip
            dist/SHA256SUMS.txt
            dist/appcast.xml
          generate_release_notes: true

      - name: Cleanup code signing identity
        if: always()
        run: ./scripts/import_codesign_identity.sh cleanup
