name: Release

on:
  push:
    tags:
      - 'v*'

env:
  XCODE_VERSION: '26.6'

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Preflight
        run: ./scripts/e2e_preflight.sh

      # Restore only: a cache saved from a tag run is scoped to that tag, and no later run can restore it.
      - name: Restore llama.cpp build cache
        uses: actions/cache/restore@v6
        with:
          path: .build/llama.cpp
          key: llama-cpp-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('scripts/setup_llama_cpp.sh') }}

      - name: Import code signing identity
        env:
          SUNIYE_CODESIGN_CERTIFICATE_P12_BASE64: ${{ secrets.SUNIYE_DEVELOPER_ID_P12_BASE64 }}
          SUNIYE_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.SUNIYE_DEVELOPER_ID_P12_PASSWORD }}
          SUNIYE_CODESIGN_IDENTITY: ${{ secrets.SUNIYE_DEVELOPER_ID_IDENTITY }}
        run: ./scripts/import_codesign_identity.sh

      - name: Package release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SUNIYE_NOTARY_API_KEY_P8: ${{ secrets.SUNIYE_NOTARY_API_KEY_P8 }}
          SUNIYE_NOTARY_API_KEY_ID: ${{ secrets.SUNIYE_NOTARY_API_KEY_ID }}
          SUNIYE_NOTARY_API_ISSUER_ID: ${{ secrets.SUNIYE_NOTARY_API_ISSUER_ID }}
        run: |
          RELEASE_NOTES_FILE="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq .body > "${RELEASE_NOTES_FILE}"
          ./scripts/package_release.sh \
            --version "${GITHUB_REF_NAME}" \
            --build-channel stable \
            --dist-dir dist \
            --release-notes-file "${RELEASE_NOTES_FILE}"

      - name: Verify release artifacts
        run: ./scripts/verify_release.sh --version "${GITHUB_REF_NAME}" --build-channel stable --dist-dir dist

      - name: Wait for main CI on the tagged commit
        timeout-minutes: 80
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/wait_for_main_ci.sh --sha "$(git rev-parse HEAD)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/Suniye.dmg
            dist/Suniye.app.zip
            dist/SHA256SUMS.txt
            dist/appcast.xml
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./scripts/update_homebrew_tap.sh --version "${GITHUB_REF_NAME}" --dist-dir dist

      - name: Cleanup code signing identity
        if: always()
        run: ./scripts/import_codesign_identity.sh cleanup
