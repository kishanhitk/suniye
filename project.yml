name: Suniye
options:
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2
  SuniyeAnalytics:
    path: SuniyeAnalytics
schemes:
  Suniye:
    build:
      targets:
        Suniye: all
    test:
      gatherCoverageData: false
      targets:
        - name: SuniyeTests
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 14.0
    MARKETING_VERSION: 0.0.8
    CURRENT_PROJECT_VERSION: 8
    SUNIYE_PRODUCT_NAME: Suniye
    SUNIYE_DISPLAY_NAME: Suniye
    SUNIYE_BUNDLE_IDENTIFIER: dev.suniye.app
    SUNIYE_BUILD_CHANNEL: stable
    SUNIYE_UPDATES_ENABLED: YES
    SUNIYE_STABLE_APPCAST_URL: https://suniye.kishans.in/appcast.xml
targets:
  Suniye:
    type: application
    platform: macOS
    sources:
      - path: Suniye
        excludes:
          - Frameworks/**
          - LocalLLM/**
          - BrowserExtension/**
          - Vendor/Permiso/PERMISO_UPSTREAM.md
    info:
      path: Suniye/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: $(SUNIYE_DISPLAY_NAME)
        ATSApplicationFontsPath: "."
        LSUIElement: true
        NSMicrophoneUsageDescription: Suniye needs microphone access to capture dictation.
        NSSpeechRecognitionUsageDescription: Suniye uses on-device speech recognition to transcribe your dictation.
        NSAppleEventsUsageDescription: Suniye uses Apple Events to carry out the voice commands you ask for in Command Mode (e.g. scripting an app).
        SuniyeIssueReportEndpointURL: https://suniye.kishans.in/api/issue-reports
        SuniyeAnalyticsEndpointURL: https://ingest.suniye.kishans.in/api/v1/events
        SuniyeBuildChannel: $(SUNIYE_BUILD_CHANNEL)
        SuniyeUpdatesEnabled: $(SUNIYE_UPDATES_ENABLED)
        SUFeedURL: $(SUNIYE_STABLE_APPCAST_URL)
        SUPublicEDKey: u4x493+uxEBa64/ypY9EWf5GZfVgA67NwXswhnKNaaw=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 18000
        SUShowReleaseNotes: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_NAME: $(SUNIYE_PRODUCT_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(SUNIYE_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Suniye/Suniye-Bridging-Header.h
        OTHER_LDFLAGS:
          - -ObjC
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Suniye/Frameworks
    dependencies:
      - package: Sparkle
      - package: SuniyeAnalytics
        product: SuniyeAnalytics
      - framework: Suniye/Frameworks/libsherpa-onnx-c-api.dylib
      - framework: Suniye/Frameworks/libonnxruntime.dylib
    postBuildScripts:
      - name: Embed Local LLM Helper
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          HELPER_SOURCE="${SUNIYE_LLAMA_SERVER_PATH:-${SRCROOT}/Suniye/LocalLLM/llama-server}"
          HELPER_DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/llama-server"
          HELPER_REQUIRED="false"

          if [[ "${CONFIGURATION}" == "Release" ]]; then
            for arch in ${ARCHS:-}; do
              if [[ "${arch}" == "arm64" || "${arch}" == "arm64e" ]]; then
                HELPER_REQUIRED="true"
                break
              fi
            done
          fi

          if [[ -x "${HELPER_SOURCE}" ]]; then
            mkdir -p "$(dirname "${HELPER_DEST}")"
            /usr/bin/ditto "${HELPER_SOURCE}" "${HELPER_DEST}"
            /bin/chmod 755 "${HELPER_DEST}"
            echo "Embedded local LLM helper: ${HELPER_DEST}"
          elif [[ "${HELPER_REQUIRED}" == "true" ]]; then
            echo "Missing local LLM helper at ${HELPER_SOURCE}. Run scripts/setup_llama_cpp.sh or set SUNIYE_LLAMA_SERVER_PATH." >&2
            exit 1
          else
            echo "Skipping local LLM helper embed; helper not found at ${HELPER_SOURCE}."
          fi
      - name: Embed Browser Extension
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/Suniye/BrowserExtension"
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Resources/BrowserExtension"
          if [[ -d "${SRC}" ]]; then
            rm -rf "${DEST}"
            mkdir -p "$(dirname "${DEST}")"
            /usr/bin/ditto "${SRC}" "${DEST}"
            echo "Embedded browser extension: ${DEST}"
          else
            echo "Skipping browser extension embed; not found at ${SRC}."
          fi
  SuniyeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SuniyeTests
    dependencies:
      - target: Suniye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.suniye.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Suniye.app/Contents/MacOS/Suniye"
        BUNDLE_LOADER: "$(TEST_HOST)"
