name: Suniye
options:
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2
schemes:
  Suniye:
    build:
      targets:
        Suniye: all
    test:
      gatherCoverageData: false
      targets:
        - name: SuniyeTests
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 14.0
    MARKETING_VERSION: 0.0.8
    CURRENT_PROJECT_VERSION: 8
    SUNIYE_BUILD_CHANNEL: stable
targets:
  Suniye:
    type: application
    platform: macOS
    sources:
      - Suniye
    info:
      path: Suniye/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ATSApplicationFontsPath: "."
        LSUIElement: true
        NSMicrophoneUsageDescription: Suniye needs microphone access to capture dictation.
        SuniyeIssueReportEndpointURL: https://suniye.kishans.in/api/issue-reports
        SuniyeBuildChannel: $(SUNIYE_BUILD_CHANNEL)
        SUFeedURL: https://suniye.kishans.in/appcast.xml
        SUPublicEDKey: u4x493+uxEBa64/ypY9EWf5GZfVgA67NwXswhnKNaaw=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUShowReleaseNotes: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.suniye.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Suniye/Suniye-Bridging-Header.h
        OTHER_LDFLAGS:
          - -ObjC
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Suniye/Frameworks
    dependencies:
      - package: Sparkle
      - framework: Suniye/Frameworks/libsherpa-onnx-c-api.dylib
      - framework: Suniye/Frameworks/libonnxruntime.dylib
  SuniyeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SuniyeTests
    dependencies:
      - target: Suniye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.suniye.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Suniye.app/Contents/MacOS/Suniye"
        BUNDLE_LOADER: "$(TEST_HOST)"
